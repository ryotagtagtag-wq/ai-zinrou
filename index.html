<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI人狼 — Gemini 7人村</title>
<style>
:root{--bg:#0c1020;--panel:#151b33;--line:#272f53;--ink:#ece9df;--mute:#8e95b2;--amber:#e8b04a;--blood:#d0605a;--day:#f3e3b8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Hiragino Sans","Yu Gothic",system-ui,sans-serif;transition:background .8s}
body.day{background:#1d2340}
.wrap{max-width:820px;margin:0 auto;padding:20px 14px 80px}
h1{font:600 28px/1.3 "Hiragino Mincho ProN","Yu Mincho",serif;margin:8px 0 2px;letter-spacing:.08em}
h1 span{color:var(--amber)}
.sub{color:var(--mute);margin:0 0 18px}
.cfg{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.cfg label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
.cfg .full{grid-column:1/-1}
.cfg .chk{flex-direction:row;align-items:center;gap:8px}
input,select{background:#0c1020;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.btns{display:flex;gap:10px;grid-column:1/-1}
button{font:inherit;border:0;border-radius:6px;padding:10px 20px;cursor:pointer;background:var(--amber);color:#1a1405;font-weight:700}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
#players{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
.pl{border:1px solid var(--c);border-radius:20px;padding:2px 12px;font-size:13px}
.pl em{font-style:normal;color:var(--amber);margin-left:6px;display:none}
body.god .pl em{display:inline}
.pl.dead{opacity:.35;text-decoration:line-through;border-style:dashed}
#status{min-height:26px;color:var(--amber);font-size:13px;margin-bottom:6px}
#log{display:flex;flex-direction:column;gap:10px}
.m.sys{align-self:center;text-align:center;color:var(--day);background:rgba(232,176,74,.08);border-radius:8px;padding:6px 14px;font-size:14px;white-space:pre-line;max-width:100%}
.m.night{font:600 17px "Hiragino Mincho ProN","Yu Mincho",serif;color:var(--amber);align-self:stretch;text-align:center;border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
.m.msg,.m.priv{border-left:3px solid var(--c);padding:4px 0 4px 12px;max-width:92%}
.m b{color:var(--c);display:block;font-size:13px}
.m .th{display:none;color:var(--mute);font-size:12px;margin-top:2px}
.m.priv{display:none;color:var(--mute);font-size:13px}
body.god .m.priv,body.god .m .th{display:block}
.m span{white-space:pre-line}
.m.sys.rules{align-self:stretch;text-align:left;font-size:13px;line-height:1.8;color:var(--ink);border:1px solid var(--line)}
.vg{align-self:center;width:min(340px,100%)}
.heat{border-collapse:collapse;font-size:11px;margin:4px 0}.heat td,.heat th{padding:2px 6px;text-align:center;border:1px solid var(--line)}
.m.mine{border-left:3px solid var(--c);padding:4px 0 4px 12px;background:rgba(232,176,74,.08);max-width:92%}
.pl.me{background:rgba(232,176,74,.15)}
.pl.me em{display:inline}
#hp{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:2px solid var(--amber);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:5}
#hp[hidden]{display:none}
#nx{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 4px 16px rgba(0,0,0,.5)}
#nx[hidden]{display:none}
#hp>*{max-width:820px;margin-inline:auto}
#hp .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#hp input{flex:1;min-width:0}
@media(max-width:520px){.cfg{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<h1>AI人狼 <span>月夜の村</span></h1>
<p class="sub">Gemini が騙し合う7〜13人の村。霊媒師・オオカミの味方・きつねも登場。</p>
<section class="cfg">
 <label class="full" id="lkey">Gemini APIキー<input id="key" type="password" placeholder="AIza..." autocomplete="off"></label>
 <label class="full" id="lproxy">プロキシURL (Cloudflare Workers。入れるとAPIキーは不要)<input id="proxy" placeholder="https://werewolf-gemini-proxy.xxxx.workers.dev"></label>
 <label class="full">アクセストークン (任意。プロキシで設定した場合のみ)<input id="ptoken" type="password" autocomplete="off"></label>
 <label>モデル<input id="model" list="ml" value="gemini-3.5-flash-lite"><datalist id="ml"><option>gemini-3.5-flash-lite</option><option>gemini-3.8-flash</option><option>gemini-3.1-pro-preview</option></datalist></label>
 <label>議論ラウンド数<select id="rounds"><option>1</option><option selected>2</option><option>3</option></select></label>
 <label>API呼出間隔 (ms)<input id="gap" type="number" value="1200" step="100" min="0"></label>
 <label>あなたの参加<select id="me"><option value="">観戦のみ</option><option value="1">1席に参加する</option></select></label>
 <label>あなたの名前<input id="myname" placeholder="あなた" maxlength="8"></label>
 <label class="chk full"><input id="rnd" type="checkbox" checked>キャラの名前・性格をGeminiで毎回ランダム生成 (3.5 Flash-Lite固定)</label>
 <label class="chk"><input id="god" type="checkbox">神視点 (役職と本音を表示)</label>
 <label class="chk full"><input id="rem" type="checkbox">APIキー・トークンをこのブラウザに保存する</label>
 <label>オオカミだけ別モデル<input id="wmodel" list="ml" placeholder="空欄=共通"></label>
 <label>村の人数<select id="size"><option value="7">7人 (オオカミ2)</option><option value="9">9人 (+霊媒師・オオカミの味方)</option><option value="13">13人 (+きつね・オオカミ3)</option></select></label>
 <label class="chk"><input id="tts" type="checkbox">発言を読み上げる</label>
 <label class="chk"><input id="strm" type="checkbox" checked>発言をストリーミング表示</label>
 <label class="chk"><input id="rev" type="checkbox" checked>終了後に感想戦</label>
 <label class="chk"><input id="kid" type="checkbox">こどもモード (ひらがな・やさしいことば)</label>
 <label class="chk"><input id="step" type="checkbox">ステップ実行 (発言ごとに「次へ」で進める)</label>
 <div class="btns"><button id="go">ゲーム開始</button><button id="stop" class="sec" disabled>中止</button><button id="save" class="sec">ログ保存</button></div>
</section>
<div id="players"></div>
<div id="status"></div>
<main id="log"></main>
<div id="hp" hidden></div>
<button id="nx" hidden>次へ ▶</button>
</div>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RJ={wolf:'オオカミ',seer:'占い師',knight:'騎士',vil:'村人',medium:'霊媒師',mad:'オオカミの味方',fox:'きつね'};
const RJ_N={...RJ},RJ_KID={wolf:'おおかみ',seer:'うらないし',knight:'まもりやく',vil:'むらびと',medium:'しらべやく',mad:'おおかみのなかま',fox:'きつね'};
let KID=false;
const STRATS_KID=['こっそり みんなに あわせて、うたがわれないようにする','うらないしの ふりをして、ちがうことを いう','だれかを おおかみだと いいはって、みんなを まよわせる'];
const KIDCAST=[['あきら','げんきで やさしい'],['みさき','おちついていて ものしり'],['げんた','おちょうしものだけど するどい'],['ゆい','おとなしくて よくみている'],['そうた','はっきり ものをいう'],['はるか','みんなの はなしを まとめたがる'],['たくみ','ちょっとクールで しずか'],['さくら','おっとりしている'],['りょう','こえが おおきくて げんき'],['なな','かずが すき ものしり'],['かいと','おもしろくて にぎやか'],['まゆ','しんぱいしょうで かくにんする'],['じん','ことばが すくなくて するどい']];
const KID_DESC={wolf:'よるに なかまと そうだんして、いたずらする あいてを きめる。むらびとの ふりを する',seer:'よるに ひとり うらなって、おおかみか どうか しる',knight:'よるに じぶんいがいの ひとりを まもる。いたずらされても だいじょうぶ',medium:'まえのひに おうちにかえった ひとが おおかみだったか しる',mad:'おおかみチームの かちを めざす。おおかみが だれかは しらない',fox:'どっちの チームでもない。いたずらされても へいき。うらなわれると おやすみに なる',vil:'とくべつな ちからは ない。おはなしと とうひょうで むらを まもる'};
const KR=[[/第0夜 — 初日の夜/g,'さいしょの よる'],[/第(\d+)夜/g,'$1にちめの よる'],[/第(\d+)日/g,'$1にちめ'],[/(\d+)日目/g,'$1にちめ'],[/(\d+)巡目/g,'$1まわりめ'],[/(\d+)巡/g,'$1まわり'],[/(?<!\d)1人/g,'ひとり'],[/(?<!\d)2人/g,'ふたり'],[/(\d+)人/g,'$1にん']];
const KD=[['キャラ生成に失敗したため、標準キャラを使います。','じゅんびに しっぱいしたので、ふつうの なかまを つかいます。'],['発言を入力 (空欄で沈黙)','はなすことを かいてね'],['同票のため、抽選で','おなじかずなので、くじびきで'],['これまでの流れを踏まえて','ここまでの ながれを ふまえて'],
['追放された人','おうちにかえったひと'],['追放したい人','おうちにかえってほしいひと'],['全員追放する','ぜんいん おうちにかえす'],['追放されました','おうちにかえりました'],['追放された','おうちにかえった'],['追放','おうちにかえす'],
['姿が見えなくなっています','すがたが みえなくなっています'],['村に残っている人','むらに のこっている ひと'],['村に残っていれば','むらに のこっていれば'],['いなくなった人','いなくなった ひと'],['観戦席に移りました','みる せきに うつりました'],['神視点','ぜんぶ みえる モード'],['観戦','みる'],['以降','これから'],
['感想を述べています','おはなしを しています'],['感想戦','おはなしの じかん'],['感想','かんそう'],['参謀に聞く','ヒントを きく'],['参謀','ヒント'],['助言','ヒント'],
['占い結果','うらないの けっか'],['占い師','うらないし'],['占う','うらなう'],['初日の朝','さいしょの あさ'],['初日','さいしょ'],['今夜','こんや'],['相手','あいて'],['選んでください','えらんでね'],['選ばれました','えらばれました'],['選んで','えらんで'],['自分以外','じぶんいがい'],['自分','じぶん'],
['見守る','まもる'],['見守り','まもり'],['ねらう候補','いたずらしたい あいて'],['ねらわれても','いたずらされても'],['ねらう','いたずらする'],['今回の作戦','こんかいの さくせん'],['作戦','さくせん'],['仲間','なかま'],
['村人陣営','むらびとチーム'],['陣営','チーム'],['村人','むらびと'],['村','むら'],['残っている','のこっている'],['残り','のこり'],['人間','にんげん'],['全員','みんな'],['無事','ぶじ'],
['投票結果','とうひょうの けっか'],['投票','とうひょう'],['結果','けっか'],['勝利','かち'],['役職','やくわり'],['配られました','くばられました'],['紛れ込んだ','まぎれこんだ'],
['議論フェーズ','はなしあい'],['発言してください','はなしてね'],['発言','はなす'],['沈黙','だまる'],['生成中','つくっています'],['中止しています','とめています'],['停止','とまりました'],['再試行中','もういちど やっています'],['終了','おわり'],['退場','おやすみ'],['考え中','かんがえちゅう'],['次へ','つぎへ'],['の番','のばん'],['の番です','のばんです'],['朝','あさ'],['昼','ひる'],['夜','よる'],['人','ひと']].sort((a,b)=>b[0].length-a[0].length);
function kid(s){
 if(!KID||!s)return s;s=String(s);
 for(const [r,t] of KR)s=s.replace(r,t);
 for(const [a,b] of KD)s=s.split(a).join(b);
 return s.replace(/[\u30A1-\u30F6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
}
const ROLESETS={7:'wolf wolf seer knight vil vil vil',9:'wolf wolf seer knight medium mad vil vil vil',13:'wolf wolf wolf seer knight medium mad fox vil vil vil vil vil'};
const STRATS=['潜伏型: 目立たず村の流れに同調し、疑われないことを最優先する','占い師騙り型: 序盤に占い師を名乗り、偽の占い結果を出して票を誘導する','偽の黒出し型: 特定の村人をオオカミと断定し、攻撃的に票を集める'];
const CAST=[['アキラ','快活で押しが強いリーダー気質'],['ミサキ','冷静で論理的、根拠を重視する'],['ゲンタ','お調子者だが勘が鋭い'],['ユイ','慎重で控えめ、矛盾をよく見ている'],['ソウタ','疑り深く直球で追及する'],['ハルカ','穏やかで皆の意見をまとめたがる'],['タクミ','皮肉屋でクール、情報を小出しにする'],['サクラ','おっとりしているが核心を突く'],['リョウ','体育会系で声が大きく勢い任せ'],['ナナ','データと確率で語りたがる'],['カイト','陽気で冗談が多く場を和ませる'],['マユ','心配性で何度も確認を取る'],['ジン','寡黙で、発言は短く鋭い']];
// ▼ ここにCloudflare WorkerのURLを入れると固定されます (例: https://werewolf-gemini-proxy.xxxx.workers.dev)
// 固定すると、APIキー欄とプロキシURL欄は画面から消え、アクセストークンだけ任意で入力できます
const PROXY_URL='https://api.ryopc.f5.si';
const LITE='gemini-3.5-flash-lite';
let P=[],L=[],run=false,day=0,morning='',H=null,hcancel=null,lastExec=null,nextRes=null;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const alive=()=>P.filter(p=>p.alive),byName=n=>P.find(p=>p.name===n),status=t=>$('#status').textContent=kid(t);

try{const k=localStorage.getItem('gk');if(k){$('#key').value=k;$('#rem').checked=true}const t=localStorage.getItem('gt');if(t)$('#ptoken').value=t}catch{}
$('#god').onchange=e=>document.body.classList.toggle('god',e.target.checked);

function renderP(){
 $('#players').innerHTML=P.map(p=>`<span class="pl ${p.alive?'':'dead'} ${p.human?'me':''}" style="--c:${p.color}" title="${esc(p.persona)}">${esc(p.name)}${p.human?'(あなた)':''}<em>${RJ[p.role]}</em></span>`).join('');
 if(H&&!H.alive&&!H.out){H.out=1;$('#god').disabled=false;$('#god').checked=true;document.body.classList.add('god');add('sys',0,'あなたは観戦席に移りました。以降は神視点で観戦できます。')}
}
function add(cls,p,text,th){
 if(cls==='priv'&&p&&p.human){cls='mine';th=null}
 if(KID){text=kid(text);th=kid(th)}
 const d=document.createElement('div');d.className='m '+cls;
 if(p){d.style.setProperty('--c',p.color);d.innerHTML=`<b>${p.name}</b><span>${esc(text)}</span>`+(th?`<div class="th">💭 ${esc(th)}</div>`:'')}
 else d.textContent=text;
 $('#log').append(d);d.scrollIntoView({block:'end',behavior:'smooth'});
}
function pub(p,text,th){L.push({day,who:p?p.name:'',text});add(p?'msg':'sys',p,text,th);p&&speak(p,text)}

async function gem(sys,user,mdl,onText){
 const key=$('#key').value.trim(),model=mdl||$('#model').value.trim()||LITE;
 const gc={temperature:1,responseMimeType:'application/json'};
 if(/^gemini-3/.test(model))gc.thinkingConfig={thinkingLevel:'low'};
 const mk=()=>JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:gc});
 let body=mk();
 const px=(PROXY_URL||$('#proxy').value).trim().replace(/\/+$/,''),tk=$('#ptoken').value.trim();
 const url=`${px||'https://generativelanguage.googleapis.com'}/v1beta/models/${encodeURIComponent(model)}:${onText?'streamGenerateContent?alt=sse':'generateContent'}${px?'':`${onText?'&':'?'}key=${encodeURIComponent(key)}`}`;
 const hd={'Content-Type':'application/json',...(px&&tk?{'x-access-token':tk}:{})};
 for(let i=0;i<5;i++){
  if(!run)throw new Error('中止しました');
  const r=await fetch(url,{method:'POST',headers:hd,body});
  if(r.ok){
   let t='';
   const pick=j=>(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('');
   if(onText){
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){
     const {done,value}=await rd.read();if(done)break;
     buf+=dec.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
     for(const l of ls)if(l.startsWith('data:'))try{t+=pick(JSON.parse(l.slice(5)));onText(t)}catch{}
    }
   }else t=pick(await r.json());
   try{const o=JSON.parse(t.replace(/```json|```/g,'').trim());return Array.isArray(o)?o[0]:o}catch{await sleep(500);continue}
  }
  if(r.status==429||r.status>=500){status(`レート制限/一時エラー(${r.status})。再試行中…`);await sleep([5,10,20,30,40][i]*1000);continue}
  const e=await r.json().catch(()=>({}));
  if(r.status===401&&px){const t=$('#ptoken');t.scrollIntoView({block:'center'});t.focus();throw new Error('アクセストークンが必要です (または違います)。「アクセストークン」欄に入力してください。')}
  if(r.status==400&&gc.thinkingConfig){delete gc.thinkingConfig;body=mk();continue}
  throw new Error(`API ${r.status}: ${e.error?.message||'不明なエラー'}`);
 }
 return null;
}

function sysP(p){
 const cnt={};P.forEach(x=>cnt[x.role]=(cnt[x.role]||0)+1);
 const comp=Object.entries(cnt).map(([r,n])=>RJ[r]+n).join('・');
 return `あなたは人狼ゲームの参加者「${p.name}」(性格: ${p.persona||'なし'})です。参加者${P.length}人のうち人間は最大1名で他はAI。構成は${comp}。
あなたの役職: ${RJ[p.role]}
${p.notes.length?'【あなただけが知る情報】\n'+p.notes.join('\n'):''}
ルール: 夜にオオカミは1人をねらう、占い師は1人を占い(オオカミか人間かが分かる)、騎士は自分以外の1人を見守る、霊媒師は前日に追放された人がオオカミだったかを知る。オオカミの味方は人間扱いだがオオカミ陣営の勝利を目指す(オオカミが誰かは知らない)。きつねは第三陣営で、ねらわれても退場しないが、占われると力を失って退場する。昼は議論後に投票で1人を追放。オオカミが全滅すれば村人陣営の勝ち、オオカミの数が人間(オオカミの味方・きつねを含む)の数以上ならオオカミ陣営の勝ち。ただしきつねが村に残っていれば、どちらの場合もきつねの勝ち。
方針: 村人陣営は発言の矛盾や投票からオオカミを推理する。オオカミ・オオカミの味方は嘘や役職騙りも使う。占い師・騎士・霊媒師は適切なタイミングで役職を明かしてよい。自分の役職や秘密情報を不用意に誤って述べないこと。あなたの発言は全員に公開される。thoughtは他人に見えない本音。
出力は指定されたJSONのみ。日本語で、キャラクターの口調を保つこと。言葉づかいは穏やかに保ち、暴力的・過激な表現は避けること。${KID?'\n【こどもモード】小さな子にもわかるよう、ひらがなだけで、みじかく、やさしいことばで話すこと。漢字・カタカナ・むずかしい言葉・こわい言葉は使わない。うたがうときも「ちょっとへんだな」のようにやわらかく言うこと。':''}`;
}
function ctx(){
 const dead=P.filter(p=>!p.alive).map(p=>p.name).join('、')||'なし';
 return `【現在】${day}日目 / 村に残っている人: ${alive().map(p=>p.name).join('、')} / いなくなった人: ${dead}\n【公開ログ】\n${L.slice(-70).map(e=>`(${e.day}日目) ${e.who?e.who+': ':''}${e.text}`).join('\n')||'(まだなし)'}`;
}
function human0(task,cands){
 return new Promise((res,rej)=>{
  const box=$('#hp'),q=esc(kid(task.split('JSON:')[0].trim()));
  const done=v=>{hcancel=null;box.hidden=true;box.innerHTML='';res(v)};
  hcancel=()=>{hcancel=null;box.hidden=true;box.innerHTML='';rej(new Error('中止しました'))};
  box.hidden=false;
  if(cands){
   box.innerHTML=`<div>${q}</div><div class="row">${cands.map(n=>`<button class="sec" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;
   box.querySelectorAll('button').forEach(b=>b.onclick=()=>done({target:b.dataset.n}));
  }else{
   box.innerHTML=`<div>${q}</div><div class="row"><input id="hin" maxlength="200" placeholder="発言を入力 (空欄で沈黙)"><button id="hsend">発言</button></div>`;
   const go=()=>done({say:$('#hin').value.trim()||'……'});
   $('#hsend').onclick=go;$('#hin').onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)go()};$('#hin').focus();
  }
 });
}
async function act(p,task,cands,live){
 if(p.human){status(`あなた (${p.name}) の番です`);return await human(task,cands)}
 if(!cands)await stepWait(`${p.name}の番`);
 await sleep(+$('#gap').value||0);
 status(`${p.name} が考え中…`);
 const r=(await gem(sysP(p),`${ctx()}\n\n【あなたの番】${task}`,(p.role==='wolf'&&$('#wmodel').value.trim())||0,live))||{};
 if(cands&&!cands.includes(r.target))r.target=cands[Math.random()*cands.length|0];
 return r;
}

function winner(){
 const w=alive().filter(p=>p.role==='wolf').length,h=alive().length-w,fox=alive().some(p=>p.role==='fox');
 if(w>0&&w<h)return null;
 return fox?'きつね':w===0?'村人陣営':'オオカミ陣営';
}
const mornMsg=(d,first)=>d.length?`🌅 朝になりました。${d.map(n=>n+'さん').join('、')}の姿が見えなくなっています。`:first?'🌅 初日の朝です。みんな無事でした。':'🌅 朝になりました。みんな無事でした。';
async function night(first){
 day===0?add('night',0,'第0夜 — 初日の夜'):add('night',0,`第${day}夜`);
 document.body.classList.remove('day');
 const al=alive(),dead=[];let kill=null,guard=null;
 const seer=al.find(p=>p.role==='seer');
 if(seer){
  const c=al.filter(p=>p!==seer&&!seer.div.includes(p.name)).map(p=>p.name);
  if(c.length){
   const r=await act(seer,'今夜占う相手を1人選んでください。JSON: {"thought":"理由","target":"名前"}',c);
   const t=byName(r.target),res=t.role==='wolf'?'オオカミ':'人間(オオカミではない)';
   seer.div.push(t.name);seer.notes.push(`${first?'初日':day+'日目'}夜の占い結果: ${t.name}は${res}`);
   add('priv',seer,`🔮 ${t.name}を占う → ${res}`,r.thought);
   if(t.role==='fox'){t.alive=false;dead.push(t.name)}
  }
 }
 const med=al.find(p=>p.role==='medium');
 if(med&&lastExec){const res=lastExec.role==='wolf'?'オオカミ':'人間(オオカミではない)';med.notes.push(`${day}日目に追放された${lastExec.name}は${res}`);add('priv',med,`🕯️ 追放された${lastExec.name}は${res}`)}
 if(first){morning=mornMsg(dead,true);renderP();return}
 const kn=al.find(p=>p.role==='knight');
 if(kn){
  const r=await act(kn,'今夜見守る相手を自分以外から1人選んでください。JSON: {"thought":"理由","target":"名前"}',al.filter(p=>p!==kn).map(p=>p.name));
  guard=byName(r.target);add('priv',kn,`🛡️ ${guard.name}を見守る`,r.thought);
 }
 const wolves=al.filter(p=>p.role==='wolf'),cand=al.filter(p=>p.role!=='wolf').map(p=>p.name);let prev='';
 for(const w of wolves){
  const r=await act(w,`今夜ねらう相手をオオカミでない村に残っている人から1人選んでください。${prev}JSON: {"thought":"理由","target":"名前"}`,cand);
  kill=byName(r.target);prev=`仲間のオオカミは${kill.name}をねらう候補にしています。`;
  add('priv',w,`🐺 ねらう相手: ${kill.name}`,r.thought);
 }
 if(kill&&kill.alive&&kill!==guard&&kill.role!=='fox'){kill.alive=false;dead.push(kill.name)}
 morning=mornMsg(dead);renderP();
}

async function discuss(){
 const R=+$('#rounds').value;
 for(let r=1;r<=R;r++){
  const al=alive(),off=(day+r)%al.length;
  for(const p of [...al.slice(off),...al.slice(0,off)]){
   const b=p.human?null:bubble(p);
   const o=await act(p,`議論フェーズ(${r}/${R}巡目)。これまでの流れを踏まえて発言してください。JSON: {"thought":"本音と戦略","say":"公開発言(100字以内)","suspicion":{"名前":0から100の数値}}。suspicionには、村に残っている自分以外の全員について、その人がオオカミだと思う度合いを入れてください。`,null,b&&b.live);
   b?b.fin(o.say||'……',o.thought):pub(p,o.say||'……',o.thought);
   if(o.suspicion&&typeof o.suspicion==='object')p.sus=o.suspicion;
  }
 }
}

async function vote(){
 add('night',0,'🗳️ 投票');
 const al=alive(),tally={},lines=[],pairs=[];
 for(const v of al){
  const c=al.filter(p=>p!==v).map(p=>p.name);
  const r=await act(v,'追放したい人を1人選んで投票してください。JSON: {"thought":"理由","target":"名前"}',c);
  tally[r.target]=(tally[r.target]||0)+1;lines.push(`${v.name} → ${r.target}`);pairs.push([v,byName(r.target)]);
  add('priv',v,`投票: ${r.target}`,r.thought);
 }
 pub(null,'🗳️ 投票結果\n'+lines.join('\n'));drawVotes(al,pairs);
 const max=Math.max(...Object.values(tally)),top=Object.keys(tally).filter(n=>tally[n]===max);
 const t=byName(top[Math.random()*top.length|0]);
 if(top.length>1)pub(null,`同票のため、抽選で${t.name}さんが選ばれました。`);
 t.alive=false;lastExec=t;pub(null,`🕊️ ${t.name}さんが追放されました。`);renderP();
}
function drawHeat(){
 const al=alive().filter(p=>!p.human&&p.sus);if(!al.length)return;
 const tg=alive(),col=v=>`rgba(208,96,90,${Math.min(1,Math.max(0,(+v||0)/100))*.85})`;
 const rows=al.map(o=>`<tr><th style="color:${o.color}">${esc(o.name.slice(0,3))}</th>${tg.map(t=>t===o?'<td>―</td>':`<td style="background:${col(o.sus[t.name])}">${Math.round(+o.sus[t.name]||0)}</td>`).join('')}</tr>`).join('');
 const d=document.createElement('div');d.className='m priv';
 d.innerHTML=`<div class="th" style="display:block">📊 疑われ度 (行=見る人 / 列=見られる人)</div><table class="heat"><tr><th></th>${tg.map(t=>`<th style="color:${t.color}">${esc(t.name.slice(0,3))}</th>`).join('')}</tr>${rows}</table>`;
 $('#log').append(d);
}
function saveLog(){
 if(!L.length){status('保存できるログがありません');return}
 const roles=run?'(ゲーム中のため非表示)':P.map(p=>`${p.name}=${RJ[p.role]}${p.alive?'':'(退場)'}`).join(', ');
 const md=`# AI人狼ログ\n\n- 日時: ${new Date().toLocaleString('ja-JP')}\n- モデル: ${$('#model').value}\n- 役職: ${roles}\n\n`+L.map(e=>`${e.day}日目 ${e.who?'**'+e.who+'**: ':''}${e.text}`).join('\n\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download='werewolf-log.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function drawVotes(al,pairs){
 const n=al.length,pos={};
 al.forEach((p,i)=>{const a=i/n*2*Math.PI-Math.PI/2;pos[p.name]=[160+120*Math.cos(a),160+120*Math.sin(a)]});
 const ar=pairs.map(([v,t])=>{const [x1,y1]=pos[v.name],[x2,y2]=pos[t.name],k=16/(Math.hypot(x2-x1,y2-y1)||1);
  return `<line x1="${x1+(x2-x1)*k}" y1="${y1+(y2-y1)*k}" x2="${x2-(x2-x1)*k}" y2="${y2-(y2-y1)*k}" stroke="${v.color}" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/>`}).join('');
 const nd=al.map(p=>`<circle cx="${pos[p.name][0]}" cy="${pos[p.name][1]}" r="14" fill="#151b33" stroke="${p.color}" stroke-width="2"/><text x="${pos[p.name][0]}" y="${pos[p.name][1]+3}" font-size="9" text-anchor="middle" fill="#ece9df">${esc(p.name.slice(0,3))}</text>`).join('');
 const d=document.createElement('div');d.className='m vg';
 d.innerHTML=`<svg viewBox="0 0 320 320" width="100%"><defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z" fill="#e8b04a"/></marker></defs>${ar}${nd}</svg>`;
 $('#log').append(d);d.scrollIntoView({block:'end',behavior:'smooth'});
}
function speak(p,text){
 if(!$('#tts').checked||p.human||!('speechSynthesis' in window))return;
 const u=new SpeechSynthesisUtterance(text),v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ja'));
 u.lang='ja-JP';if(v)u.voice=v;u.pitch=p.pitch;u.rate=p.rate;speechSynthesis.speak(u);
}
function bubble(p){
 if(!$('#strm').checked)return null;
 const d=document.createElement('div');d.className='m msg';d.style.setProperty('--c',p.color);
 d.innerHTML=`<b>${esc(p.name)}</b><span>…</span>`;$('#log').append(d);
 const sp=d.querySelector('span'),sc=()=>d.scrollIntoView({block:'end'});
 return{live:t=>{const m=t.match(/"say"\s*:\s*"((?:[^"\\]|\\.)*)/);if(m){sp.textContent=kid(m[1].replace(/\\n/g,'\n').replace(/\\"/g,'"'));sc()}},
  fin:(text,th)=>{sp.textContent=kid(text);if(th)d.insertAdjacentHTML('beforeend',`<div class="th">💭 ${esc(kid(th))}</div>`);L.push({day,who:p.name,text});speak(p,text);sc()}};

function human(task,cands){
 const pr=human0(task,cands),ab=document.createElement('button');
 ab.className='sec';ab.textContent=kid('💡参謀に聞く');
 ab.onclick=async()=>{ab.disabled=true;try{const r=await gem(sysP(H),`${ctx()}\n\n【依頼】あなたはこのプレイヤーの参謀AIです。今の状況で最も疑うべき(または信頼すべき)相手と理由を助言してください。プレイヤー本人が知らない情報は使わないこと。JSON: {"advice":"100字以内の助言"}`);add('sys',0,'💡参謀: '+(r?.advice||'助言を得られませんでした'))}catch(e){status('参謀エラー: '+e.message)}ab.disabled=false};
 $('#hp .row').append(ab);if(KID){$('#hp').querySelectorAll('button:not([data-n])').forEach(b=>{if(b!==ab)b.textContent=kid(b.textContent)});const i=$('#hin');if(i)i.placeholder=kid(i.placeholder)}return pr;

function stepWait(label){
 if(!$('#step').checked)return Promise.resolve();
 return new Promise((res,rej)=>{
  const b=$('#nx');b.hidden=false;b.textContent=kid(`次へ ▶ (${label})`);
  const fin=()=>{hcancel=null;nextRes=null;b.hidden=true;res()};
  nextRes=fin;b.onclick=fin;
  hcancel=()=>{hcancel=null;nextRes=null;b.hidden=true;rej(new Error('中止しました'))};
 });

 const roles=P.map(p=>`${p.name}=${RJ[p.role]}`).join('、');
 for(const p of P){

async function genCast(N){
 const KC=KID?KIDCAST:CAST;
 if(!$('#rnd').checked)return KC.slice(0,N);
 status('Gemini 3.5 Flash-Lite がキャラクターを生成中…');
 const r=await gem('あなたは人狼ゲームのキャラクター設計者です。出力はJSONのみ。',`人狼ゲームの参加者${N}人分のキャラクターを作ってください。${KID?'名前はひらがな2〜4文字(全員異なる)。性格はひらがなだけの15字以内のやさしい説明で、全員が明確に異なること。':'名前は日本人の下の名前で、読みやすい2〜4文字のカタカナまたはひらがな(全員異なる)。性格は口調や議論の癖が分かる25字以内の説明で、全員が明確に異なること。'}毎回違う顔ぶれにすること。JSON: {"players":[{"name":"...","persona":"..."}]}`,LITE);
 const a=r?.players;
 if(Array.isArray(a)&&a.length>=N){
  const c=a.slice(0,N).map(x=>[String(x?.name||'').trim(),String(x?.persona||'').trim()]);
  if(c.every(x=>x[0]&&x[1]&&x[0].length<=8&&(!KID||/^[\u3041-\u3096ー]+$/.test(x[0])))&&new Set(c.map(x=>x[0])).size===N)return c;
 }
 add('sys',0,'キャラ生成に失敗したため、標準キャラを使います。');return KC.slice(0,N);
}
const RULE_DESC={wolf:'夜に仲間と相談して1人をねらう。正体を隠して村人のふりをする',seer:'夜に1人を占い、オオカミかどうかを知る',knight:'夜に自分以外の1人を見守り、ねらわれても守る',medium:'前日に追放された人がオオカミだったかを知る',mad:'人間扱いだが、オオカミ陣営の勝利を目指す(オオカミが誰かは知らない)',fox:'どちらの陣営でもない。ねらわれても退場しないが、占われると力を失って退場する',vil:'特別な力はない。話し合いと投票で村を守る'};

 if(KID){add('sys rules',0,['📜 ルール',`■ むらの なかま (${P.length}にん)`,...ks.map(k=>`・${RJ[k]} ×${cnt[k]}: ${KID_DESC[k]}`),'■ 1にちの ながれ','あさ: よるの あいだに いなくなった ひとを おしらせ',`ひる: みんなで おはなし (${$('#rounds').value}まわり)`,'とうひょう: いちばん あやしい ひとを ひとり えらぶ (おなじかずは くじびき)','よる: やくわりごとに こっそり うごく (さいしょの よるは うらないだけ)','■ かちかた','むらびとチーム: おおかみを ぜんいん おうちにかえす','おおかみチーム: おおかみが のこりの ひとと おなじか おおくなる',...(cnt.fox?['きつね: むらに のこっていれば、どっちが かっても かち']:[])].join('\n'));return}
 add('sys rules',0,['📜 ルール',`■ 村の構成 (${P.length}人)`,...ks.map(k=>`・${RJ[k]} ×${cnt[k]}: ${RULE_DESC[k]}`),
  '■ 1日の流れ','朝: 夜の間に姿が見えなくなった人を発表',`昼: 全員で話し合い (${$('#rounds').value}巡)`,'投票: いちばん怪しい人を1人追放 (同票は抽選)','夜: 役職ごとにこっそり行動 (初日の夜は占いだけ)',
  '■ 勝利条件','村人陣営: オオカミを全員追放する','オオカミ陣営: オオカミの数が、残りの人の数以上になる',...(cnt.fox?['きつね: 村に残っていれば、勝った陣営にかかわらず勝ち']:[])].join('\n'));
}
async function main(){
 KID=$('#kid').checked;Object.assign(RJ,KID?RJ_KID:RJ_N);
 L=[];day=0;lastExec=null;$('#log').innerHTML='';H=null;window.speechSynthesis?.cancel();
 const N=+$('#size').value,roles=shuf(ROLESETS[N].split(' ')),cast=await genCast(N);
 P=cast.map(([name,persona],i)=>({name,persona,role:roles[i],alive:true,notes:[],div:[],color:`hsl(${i*360/N+15|0},70%,68%)`,pitch:.6+(i*3%5)*.25,rate:.95+(i%3)*.12}));
 if($('#me').value){
  H=P[Math.random()*P.length|0];H.human=true;H.persona='';
  let nm=$('#myname').value.trim()||'あなた';
  while(P.some(x=>x!==H&&x.name===nm))nm+='★';
  H.name=nm;
 }
 $('#god').disabled=!!H;
 if(H){$('#god').checked=false;document.body.classList.remove('god')}
 const wolves=P.filter(p=>p.role==='wolf'),ws=wolves.map(p=>p.name),st=shuf(KID?STRATS_KID:STRATS);
 wolves.forEach((p,i)=>{p.notes.push(`仲間のオオカミ: ${ws.filter(n=>n!==p.name).join('、')}`);p.notes.push(`今回の作戦: ${st[i%st.length]}`)});
 renderP();
 showRules();
 add('sys',0,'村にオオカミが紛れ込んだ…。役職が配られました。');
 if(H)add('mine',H,`あなたの役職は【${RJ[H.role]}】です。`+(H.notes.length?'\n'+H.notes.join('\n'):''));
 await night(true);
 while(true){
  day++;document.body.classList.add('day');
  add('night',0,`第${day}日`);pub(null,morning);
  let w=winner();if(w)return w;
  await discuss();drawHeat();await stepWait('投票へ');await vote();
  w=winner();if(w)return w;
  await stepWait('夜へ');await night(false);
  w=winner();if(w){day++;pub(null,morning);return w}
 }
}
